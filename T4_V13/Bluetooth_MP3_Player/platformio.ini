; ---------------------------------------------------------------------------
; LILYGO TTGO T4 V1.3 — Bluetooth MP3 Player (A2DP Source)
; ---------------------------------------------------------------------------
; Streams MP3 files from the microSD card to a user-picked Bluetooth
; headphone / speaker (Classic Bluetooth A2DP).
;
; Board: TTGO T4 V1.3, classic ESP32 (dual-core, Bluetooth Classic + BLE),
; 4 MB flash. PSRAM exists on the board but this firmware does not need it.
;   Display : ILI9341 240x320 portrait controller, 2.4-inch landscape 320x240
;             HSPI: MISO 12, MOSI 23, SCLK 18, CS 27, DC 32, RST 5, BL 4
;   SD card : VSPI: MISO 2, MOSI 15, SCLK 14, CS 13, FAT32-formatted
;   Buttons : left 37, middle 38, right 39 (active LOW, INPUT_PULLUP)
; ---------------------------------------------------------------------------

[env:lilygo_t4_v13]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; decode ESP32 backtraces inline so crashes arrive already symbolised
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
lib_ldf_mode = deep

build_flags =
    ; --- TFT_eSPI setup for TTGO T4 V1.3 (matches User_Setups/T4_V13.h) ---
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=27
    -DTFT_DC=32
    -DTFT_RST=5
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    ; --- LVGL: lv_conf.h lives in include/ (visible to ALL compile units) ---
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; level 1 (ERROR): keeps the serial log readable — the A2DP library logs
    ; 4 INFO lines per scanned device, which drowns everything otherwise.
    ; Our own [BT]/[MP3]/[ST]/[UI] diagnostics print regardless.
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; --- PSRAM: playlist storage lives there — the Bluetooth stack needs
    ;     every byte of internal RAM it can get at init time ---
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; --- Bluetooth: free BLE RAM — we only use Classic BT (A2DP) ---
    -DBT_SPP=0 -DBT_BLE_ENABLED=0 -DBT_GATTS_ENABLE=0

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    ; latest master: v1.8.11 still used the removed ESP_A2D_AUDIO_STATE_SUSPEND constant
    https://github.com/pschatzmann/ESP32-A2DP.git#a9e946a078f9bc5334038cbf90a7237e9e726cd2
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.6
    https://github.com/pschatzmann/codec-helix.git#v0.9.4
